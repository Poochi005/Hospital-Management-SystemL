<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doctor - Hospital Management System</title>
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div class="topbar">
  <h1>🏥 HMS – Doctor</h1>
  <div class="who"><span id="who"></span><button class="btn ghost small" onclick="logout()">Logout</button></div>
</div>
<main>
  <div class="card"><h2>My appointments</h2><div id="appList"></div></div>
</main>

<dialog id="dlg">
  <h2 style="margin-top:0">Complete appointment</h2>
  <p id="dlgInfo" class="hint"></p>
  <form id="cForm">
    <div style="margin-bottom:10px"><label for="diag">Diagnosis</label><textarea id="diag" required></textarea></div>
    <div style="margin-bottom:10px"><label for="presc">Prescription</label><textarea id="presc" required></textarea></div>
    <div style="margin-bottom:14px"><label for="med">Medicine charges (₹)</label><input id="med" type="number" min="0" step="0.01" value="0"></div>
    <button class="btn">Save and generate bill</button>
    <button class="btn" type="button" style="background:#64748b" onclick="dlg.close()">Close</button>
  </form>
</dialog>
<div id="toast"></div>
<script src="./js/local-api.js"></script>
<script src="./js/common.js"></script>
<script src="./js/doctor.js"></script>
</body>
</html>
